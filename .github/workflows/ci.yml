name: Reference tests

on:
  push:
    branches: [main]
    paths: ["examples/**", "build.sbt", "project/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["examples/**", "build.sbt", "project/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile reference and run original plus characterization tests
        run: sbt -batch test
